# Regression check suite, lint ratchet and seed-42 baseline reproduction.
#
# Every job runs in the container the project's baseline figures are produced
# in: rocker/rstudio:4.4.2 at the digest CLAUDE.md's provenance note names, with
# the system libraries .devcontainer/Dockerfile installs and the package
# versions renv.lock pins. A gate that ran in a different environment could not
# tell a genuine regression from an environment difference, which for the
# seed-42 reproduction is the whole question.
#
# The suite is split by cost, on the runtimes measured in scripts/README.md.
# The fast suite runs on every pull request, several checks at a time;
# check_dow_calibration.R runs 450 replications and takes three quarters of an
# hour, so it runs weekly and on demand instead.
#
# A pull request that changes no code is classified as such by the first job
# and narrows what the others run: the three checks that read the tracked
# documents, and not the lint ratchet or the seed-42 reproduction, neither of
# which a prose edit can move. The jobs still run and still report, rather than
# being skipped by a path filter, because a required status check that never
# reports leaves a pull request waiting for it forever.

name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Sundays at 02:00 UTC, for the slow suite.
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      run_slow_suite:
        description: "Run the slow suite (check_dow_calibration.R, ~45 minutes)"
        type: boolean
        default: false

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pinned container of CLAUDE.md's provenance note and scripts/README.md.
  CONTAINER_IMAGE: rocker/rstudio:4.4.2@sha256:6bfc87fb66d0072e28d88d684a1f7b3e42a1c20360ee5eca5b43168a4eba3945
  # Binary packages for the container's Ubuntu release, so restoring the
  # lockfile takes minutes rather than the hour a source build would.
  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest
  RENV_PATHS_CACHE: /github/home/.cache/R/renv
  # lintr is developer tooling rather than a simulation dependency, so it is
  # not in renv.lock; see docs/STYLE_GUIDE.md. The version is pinned because
  # the lint ratchet compares against counts measured at one version.
  LINTR_VERSION: 3.4.0

jobs:
  classify:
    name: Classify the change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this change can move the model
        id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          # Anything other than a pull request runs the full suite: a push to
          # main, the weekly schedule and a manual dispatch all want the whole
          # gate rather than a subset inferred from one diff.
          if [ "$IS_PULL_REQUEST" != "true" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request; running the full suite."
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "Files changed against origin/$BASE_REF:"
          echo "$changed" | sed 's/^/  /'
          # Every path whose change could move a model output, a lint count or
          # the tracked baseline. data/, images/ and logs/ are here because they
          # are the baseline evidence set the reproduction check compares
          # against, and .github/workflows/ because a change to the gate itself
          # is verified by running it in full. tests/, package.json,
          # package-lock.json and playwright.config.js are here because a change
          # to either test suite is verified by running it, exactly as a change
          # to a check script is.
          if echo "$changed" | grep -Eq '^(R/|scripts/|tests/|data/|images/|logs/|run\.R|app\.R|env_data\.json|renv\.lock|\.Rprofile|\.lintr|package\.json|package-lock\.json|playwright\.config\.js|\.devcontainer/|\.github/workflows/)'; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "Change reaches code, configuration or the tracked baseline; running the full fast suite."
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change; running the document checks alone."
          fi

  fast-checks:
    name: Fast suite and lint ratchet
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: rocker/rstudio:4.4.2@sha256:6bfc87fb66d0072e28d88d684a1f7b3e42a1c20360ee5eca5b43168a4eba3945
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev libtiff5-dev \
            libjpeg-dev libharfbuzz-dev libfribidi-dev libglpk-dev libuv1t64 \
            git

      - name: Cache the renv package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.RENV_PATHS_CACHE }}
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: renv-${{ runner.os }}-

      - name: Restore the project library
        run: Rscript -e 'renv::restore(prompt = FALSE)'

      - name: Install lintr
        if: needs.classify.outputs.code_changed == 'true'
        run: Rscript -e 'renv::install(paste0("lintr@", Sys.getenv("LINTR_VERSION")))'

      # --jobs auto runs one check per logical core of the runner, dividing
      # the cores between them so the replication framework's own forks do not
      # oversubscribe the machine. A check's result is a function of its seed
      # rather than of the cores it was measured on, so this changes what the
      # suite costs and not what it concludes.
      - name: Run the fast suite
        if: needs.classify.outputs.code_changed == 'true'
        run: Rscript scripts/run_all_checks.R --fast --jobs auto

      # A documentation-only change cannot move a model output or a lint count,
      # so only the checks that read the tracked documents are worth its time.
      - name: Run the document checks
        if: needs.classify.outputs.code_changed != 'true'
        run: >-
          Rscript scripts/run_all_checks.R
          --only 'check_(markdown|references|env_data_summary)'

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-check-logs
          path: outputs/checks/
          if-no-files-found: ignore

  # The fast suite already includes this check. It is also run as a job of its
  # own so that it reports as a separate status check on the pull request:
  # every published seed-42 figure rests on it, and a reviewer should be able
  # to see its result without opening the suite's log.
  baseline-reproduction:
    name: Seed-42 baseline reproduction
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: rocker/rstudio:4.4.2@sha256:6bfc87fb66d0072e28d88d684a1f7b3e42a1c20360ee5eca5b43168a4eba3945
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev libtiff5-dev \
            libjpeg-dev libharfbuzz-dev libfribidi-dev libglpk-dev libuv1t64 \
            git

      - name: Cache the renv package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.RENV_PATHS_CACHE }}
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: renv-${{ runner.os }}-

      - name: Restore the project library
        if: needs.classify.outputs.code_changed == 'true'
        run: Rscript -e 'renv::restore(prompt = FALSE)'

      - name: Reproduce the tracked seed-42 evidence set
        if: needs.classify.outputs.code_changed == 'true'
        run: Rscript scripts/check_baseline_reproduction.R

      # The job still runs and still reports, so a required status check on it
      # is satisfied on a documentation-only change rather than left pending.
      - name: Report the reproduction as not applicable
        if: needs.classify.outputs.code_changed != 'true'
        run: >-
          echo "Documentation-only change; no run consumes a random draw, so
          the seed-42 evidence set cannot have moved."

  # The console's browser suite. It is its own job rather than part of the
  # fast suite because it needs a Node toolchain and a running app, neither of
  # which the pinned container provides and neither of which any other check
  # wants. The R half of the console's coverage (shiny::testServer over the
  # reactive state machine) is pure R and runs inside the fast suite instead.
  #
  # Playwright's browser is downloaded here. The repository's own development
  # environments provide one at PLAYWRIGHT_BROWSERS_PATH and the suite uses it
  # unchanged; a fresh runner has none, so the step below fetches exactly the
  # Chromium the pinned @playwright/test version expects.
  browser-checks:
    name: Shiny console browser suite
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: rocker/rstudio:4.4.2@sha256:6bfc87fb66d0072e28d88d684a1f7b3e42a1c20360ee5eca5b43168a4eba3945
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        if: needs.classify.outputs.code_changed == 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev libtiff5-dev \
            libjpeg-dev libharfbuzz-dev libfribidi-dev libglpk-dev libuv1t64 \
            git

      - uses: actions/setup-node@v4
        if: needs.classify.outputs.code_changed == 'true'
        with:
          node-version: "22"

      - name: Cache the renv package cache
        if: needs.classify.outputs.code_changed == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.RENV_PATHS_CACHE }}
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: renv-${{ runner.os }}-

      - name: Restore the project library
        if: needs.classify.outputs.code_changed == 'true'
        run: Rscript -e 'renv::restore(prompt = FALSE)'

      - name: Install the browser toolchain
        if: needs.classify.outputs.code_changed == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the browser suite
        if: needs.classify.outputs.code_changed == 'true'
        run: npx playwright test

      # The job still runs and still reports, so a required status check on it
      # is satisfied on a documentation-only change rather than left pending.
      - name: Report the browser suite as not applicable
        if: needs.classify.outputs.code_changed != 'true'
        run: >-
          echo "Documentation-only change; the console's code is untouched, so
          the browser suite has nothing new to exercise."

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  slow-checks:
    name: Slow suite
    # Weekly, on demand, and never on a pull request: the calibration check
    # takes three quarters of an hour on four cores.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_slow_suite)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: rocker/rstudio:4.4.2@sha256:6bfc87fb66d0072e28d88d684a1f7b3e42a1c20360ee5eca5b43168a4eba3945
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libpng-dev libtiff5-dev \
            libjpeg-dev libharfbuzz-dev libfribidi-dev libglpk-dev libuv1t64 \
            git

      - name: Cache the renv package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.RENV_PATHS_CACHE }}
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: renv-${{ runner.os }}-

      - name: Restore the project library
        run: Rscript -e 'renv::restore(prompt = FALSE)'

      - name: Run the slow suite
        run: Rscript scripts/run_all_checks.R --slow

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-check-logs
          path: outputs/checks/
          if-no-files-found: ignore
